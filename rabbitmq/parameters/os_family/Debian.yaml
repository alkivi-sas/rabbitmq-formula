# -*- coding: utf-8 -*-
# vim: ft=yaml
#
# Set values specific to:
#   salt['config.get']('os_family') == Debian.
#
# You just need to add the key:values for this `os_family` that differ
# from `defaults.yaml` + `<osarch>.yaml`.
#
# If you do not need to provide defaults via the `os_family` config,
# you can remove this file or provide at least an empty dict, e.g.
# values: {}
---
values:
  pkg:
    deps:
      - libtinfo5
      - erlang-eldap
    repo:
      # https://www.rabbitmq.com/docs/install-debian#apt-quick-start-cloudsmith
      # yamllint disable-line rule:line-length
      key_url: https://keys.openpgp.org/vks/v1/by-fingerprint/0A9AF2115F4687BD29803A206B73A36E6026DFCA
      keyring: /usr/share/keyrings/com.rabbitmq.team.gpg
      erlang:
        url: https://deb1.rabbitmq.com/rabbitmq-erlang
      rabbitmq:
        url: https://deb1.rabbitmq.com/rabbitmq-server
...
